
name = "telegram-bot"
main = "src/index.js"
compatibility_date = "2025-09-01"
workers_dev = true

[[kv_namespaces]]
binding = "BOT_KV"
id = "1a36404efb354d1e87d5fea9a50a9d0b"

[assets]
directory = "./public"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*", "/telegram/*", "/pay/*", "/internal/*", "/service-pay/*", "/sub/*", "/sub-all/*", "/bots/*", "/cr-hook/*", "/cr-relay/*"]

[vars]
APP_VERSION = "3.4.0"
# Sender for portfolio contact-form mail (Resend). Override with the secret
# CONTACT_FROM_EMAIL once your own domain is verified with the provider.
CONTACT_FROM_EMAIL = "Portfolio <onboarding@resend.dev>"


[[durable_objects.bindings]]
name = "BOT_STATE"
class_name = "BotCoordinator"

[[migrations]]
tag = "v2-durable-state"
new_sqlite_classes = ["BotCoordinator"]

[triggers]
crons = ["* * * * *"]

# Optional encrypted nightly service backups. Create the bucket before enabling:
# [[r2_buckets]]
# binding = "BACKUPS"
# bucket_name = "botpanel-service-backups"
